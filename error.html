<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page unavailable · Northstar</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f7f8fc;color:#30384c;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.card{width:min(480px,calc(100% - 36px));padding:36px;border:1px solid #e9ebf2;border-radius:19px;background:#fff;box-shadow:0 14px 44px #27314a0b}.symbol{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#fff0e9;color:#d37c5b;font-size:21px}.eyebrow{margin:22px 0 7px;color:#8993c8;font-size:9px;font-weight:750;letter-spacing:1.5px;text-transform:uppercase}h1{margin:0;font-size:24px;letter-spacing:-.7px}p{margin:11px 0 22px;color:#858da0;font-size:12px;line-height:1.65}.address{overflow:hidden;margin:0 0 20px;padding:10px 12px;border-radius:9px;background:#f6f7fa;color:#677087;font:10px ui-monospace,monospace;text-overflow:ellipsis;white-space:nowrap}details{margin:0 0 18px;color:#768096;font-size:10px}summary{cursor:pointer}.details{white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{height:36px;padding:0 13px;border:1px solid #e7e9f0;border-radius:9px;background:#fff;color:#677087;font-size:11px;cursor:pointer}.actions button.primary{border-color:#5f73e7;background:#5f73e7;color:#fff}.actions button:hover{filter:brightness(.97)}</style></head>
<body><main class="card"><div class="symbol">↗</div><p class="eyebrow">A small detour</p><h1>This page didn’t load.</h1><p id="message">The connection may be unavailable. Check the address or try again.</p><div class="address" id="address"></div><details><summary>Failure details</summary><p class="details" id="details"></p></details><div class="actions"><button class="primary" id="retry">Try again</button><button onclick="history.back()">Go back</button><button id="copy">Copy details</button></div><p id="copied" aria-live="polite"></p></main>
<script>const query=new URLSearchParams(location.search);const url=query.get('url')||'';const code=query.get('code')||'unknown';const reason=query.get('error')||'The connection may be unavailable. Check the address or try again.';document.getElementById('address').textContent=url;document.getElementById('message').textContent=reason;document.getElementById('details').textContent=`Error ${code}: ${reason}\nAddress: ${url}`;document.getElementById('retry').onclick=()=>{if(url)location.replace(url)};document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(`Northstar navigation error ${code}\n${reason}\n${url}`);document.getElementById('copied').textContent='Details copied.'}catch{document.getElementById('copied').textContent='Clipboard access is unavailable.'}};</script></body></html>
