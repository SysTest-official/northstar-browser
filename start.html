<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc">
  <title>New tab · Northstar</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:auto;background:#f7f8fc;color:#252c40;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.page{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:38px 24px 72px;isolation:isolate}.wash{position:absolute;z-index:-1;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 6%,#fff 0,transparent 52%),linear-gradient(180deg,#fafbfe,#f5f7fb)}.wash:before,.wash:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(72px);opacity:.18}.wash:before{top:-210px;left:12%;background:#91a0ff}.wash:after{right:9%;bottom:-270px;background:#ffbba1}.content{width:min(630px,100%);margin:auto;text-align:center}.mark{width:58px;height:58px;margin:0 auto 22px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(145deg,#586ee6,#8692f2);box-shadow:0 12px 28px #6275df3d, inset 0 1px 0 #ffffff70}.mark svg{width:34px;height:34px;fill:none;stroke:#fff;stroke-width:1.35;stroke-linejoin:round}.mark circle{fill:#fff;stroke:none}.eyebrow{margin:0 0 9px;color:#7f8ac8;font-size:10px;font-weight:750;letter-spacing:2px;text-transform:uppercase}h1{margin:0;color:#283047;font-size:clamp(29px,5vw,43px);font-weight:690;letter-spacing:-1.9px;line-height:1.12}.sub{margin:13px 0 26px;color:#858da0;font-size:13px}.search{height:54px;display:flex;align-items:center;gap:11px;padding:0 8px 0 17px;border:1px solid #e7e9f1;border-radius:15px;background:#fff;box-shadow:0 9px 28px #2934530b,0 2px 6px #29345306;transition:.18s}.search:focus-within{border-color:#9aa7ed;box-shadow:0 0 0 4px #667bed1b,0 10px 30px #29345310}.search svg{width:18px;height:18px;flex:none;fill:none;stroke:#9aa2b3;stroke-width:1.7;stroke-linecap:round}.search input{height:100%;flex:1;min-width:0;border:0;outline:0;background:transparent;color:#30384c;font-size:13px;font-family:inherit}.search input::placeholder{color:#a5abba}.search button{height:38px;padding:0 14px;border:0;border-radius:10px;background:#5f73e7;color:white;font-size:11px;font-weight:650;cursor:pointer;box-shadow:0 4px 10px #6074e640;transition:.16s}.search button:hover{background:#4e63db;transform:translateY(-1px)}.section-label{margin:34px 0 13px;text-align:left;color:#9299a8;font-size:9px;font-weight:750;letter-spacing:1.2px}.links{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.link{display:flex;align-items:center;gap:10px;min-width:0;padding:12px 11px;border:1px solid #eaecf2;border-radius:12px;background:#ffffffbd;color:#5c6579;text-decoration:none;text-align:left;transition:.18s}.link:hover{transform:translateY(-2px);border-color:#d9def3;background:white;box-shadow:0 8px 18px #2934530c}.link-icon{width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:9px;background:#edf0ff;color:#586de1;font-size:12px;font-weight:750}.link:nth-child(2) .link-icon{background:#fff0e9;color:#d87c59}.link:nth-child(3) .link-icon{background:#e7f5ef;color:#3c9677}.link:nth-child(4) .link-icon{background:#f0ecfa;color:#8966bb}.link-copy{min-width:0}.link-copy strong,.link-copy span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link-copy strong{font-size:10px;font-weight:650;color:#444d62}.link-copy span{margin-top:3px;font-size:8px;color:#a0a6b3}.foot{position:absolute;left:0;right:0;bottom:20px;text-align:center;color:#aab0bc;font-size:9px}.foot span{color:#7c8be2}html[data-theme="dark"] body{background:#191f30;color:#e7eaf4}html[data-theme="dark"] .wash{background:radial-gradient(ellipse at 50% 6%,#2a334d 0,transparent 55%),linear-gradient(180deg,#202638,#191f30)}html[data-theme="dark"] h1{color:#edf0fa}html[data-theme="dark"] .sub{color:#a2abc0}html[data-theme="dark"] .search{background:#252c40;border-color:#3d455d}html[data-theme="dark"] .search input{color:#f0f2fa}html[data-theme="dark"] .search input::placeholder,html[data-theme="dark"] .section-label,html[data-theme="dark"] .foot{color:#9ca5bb}html[data-theme="dark"] .link{background:#252c40;border-color:#3c4459}html[data-theme="dark"] .link:hover{background:#303850;border-color:#56628c}html[data-theme="dark"] .link-copy strong{color:#e1e5f1}html[data-theme="dark"] .link-copy span{color:#a0a8bb}@media(prefers-color-scheme:dark){html[data-theme="system"] body{background:#191f30;color:#e7eaf4}html[data-theme="system"] .wash{background:radial-gradient(ellipse at 50% 6%,#2a334d 0,transparent 55%),linear-gradient(180deg,#202638,#191f30)}html[data-theme="system"] h1{color:#edf0fa}html[data-theme="system"] .sub{color:#a2abc0}html[data-theme="system"] .search{background:#252c40;border-color:#3d455d}html[data-theme="system"] .search input{color:#f0f2fa}html[data-theme="system"] .link{background:#252c40;border-color:#3c4459}html[data-theme="system"] .link-copy strong{color:#e1e5f1}html[data-theme="system"] .section-label,html[data-theme="system"] .foot{color:#9ca5bb}}@media(max-width:560px){.page{padding:24px 17px 56px}.links{grid-template-columns:repeat(2,1fr)}h1{font-size:31px}.sub{font-size:11px}}
  
.section-heading{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}.section-heading .section-label{margin:0}.section-heading button{border:0;background:transparent;color:#9299a8;font-size:9px;cursor:pointer}.section-heading button:hover{color:#586de1}.links{grid-template-columns:repeat(4,minmax(0,1fr))}.shortcut-card{position:relative;min-width:0}.shortcut-card.moving{opacity:.45}.shortcut-card .link{height:100%;padding-right:24px}.shortcut-card:nth-child(4n+2) .link-icon{background:#fff0e9;color:#d87c59}.shortcut-card:nth-child(4n+3) .link-icon{background:#e7f5ef;color:#3c9677}.shortcut-card:nth-child(4n+4) .link-icon{background:#f0ecfa;color:#8966bb}.remove-shortcut{position:absolute;top:4px;right:4px;width:18px;height:18px;border:0;border-radius:6px;background:#fff;color:#9ba2b0;font-size:15px;line-height:15px;opacity:0;cursor:pointer}.shortcut-card:hover .remove-shortcut{opacity:1}.remove-shortcut:hover{background:#fff0ec;color:#ca7057}.add-shortcut{display:flex;align-items:center;gap:9px;padding:10px;border:1px dashed #dfe3ed;border-radius:12px;background:#ffffff70;color:#9098aa;text-align:left;cursor:pointer}.add-shortcut:hover{border-color:#aab5ed;background:#fff;color:#586de1}.add-shortcut span{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:#f0f2fa;font-size:17px}.add-shortcut strong{font-size:9px;font-weight:600}#shortcutDialog{width:min(390px,calc(100% - 32px));padding:26px;border:1px solid #e8eaf0;border-radius:17px;background:#fff;color:#30384c;box-shadow:0 22px 80px #20283b35}#shortcutDialog::backdrop{background:#18203355;backdrop-filter:blur(3px)}#shortcutForm{display:grid;gap:8px}.dialog-eyebrow{color:#7f8ac8;font-size:9px;font-weight:750;letter-spacing:1.4px}.shortcutForm h2,#shortcutForm h2{margin:0 0 9px;font-size:20px;letter-spacing:-.5px}#shortcutForm label{margin-top:3px;color:#747e92;font-size:9px;font-weight:650}#shortcutForm input{height:39px;padding:0 11px;border:1px solid #e5e8ef;border-radius:9px;outline:0;font-size:11px;font-family:inherit}#shortcutForm input:focus{border-color:#8495e8;box-shadow:0 0 0 3px #7184ef20}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.dialog-actions button{height:34px;padding:0 13px;border:1px solid #e7e9ef;border-radius:8px;background:#fff;color:#778095;font-size:10px;cursor:pointer}.dialog-actions .save-shortcut{border-color:#5f73e7;background:#5f73e7;color:white}@media(max-width:560px){.links{grid-template-columns:repeat(2,minmax(0,1fr))}}
html[data-theme="dark"] .section-heading button{color:#a0a8bb}html[data-theme="dark"] .add-shortcut{border-color:#48516b;background:#252c40;color:#b0b8cb}html[data-theme="dark"] .add-shortcut span{background:#333b53}html[data-theme="dark"] .add-shortcut:disabled{opacity:.45;cursor:not-allowed}html[data-theme="dark"] .remove-shortcut{background:#30374d;color:#c2c8d7}html[data-theme="dark"] #shortcutDialog{border-color:#3c4459;background:#252c40;color:#edf0fa}html[data-theme="dark"] #shortcutForm label{color:#adb5c7}html[data-theme="dark"] #shortcutForm input{border-color:#414960;background:#202638;color:#edf0fa}html[data-theme="dark"] .dialog-actions button{border-color:#414960;background:#30374d;color:#c2c8d7}@media(prefers-color-scheme:dark){html[data-theme="system"] .add-shortcut{border-color:#48516b;background:#252c40;color:#b0b8cb}html[data-theme="system"] .add-shortcut span{background:#333b53}html[data-theme="system"] #shortcutDialog{border-color:#3c4459;background:#252c40;color:#edf0fa}html[data-theme="system"] #shortcutForm input{border-color:#414960;background:#202638;color:#edf0fa}}

.recent-section{margin-top:19px;text-align:left}.recent-section .section-label{margin:0 0 8px}.recent-link{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-top:1px solid #eceef3;color:#687187;text-decoration:none;font-size:9px}.recent-link:hover{color:#5368db;background:#ffffff80}.recent-link strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.recent-link span{color:#a0a6b3;white-space:nowrap}html[data-theme="dark"] .recent-link{border-color:#3c4459;color:#c2c8d7}html[data-theme="dark"] .recent-link:hover{background:#252c40;color:#dbe0ff}html[data-theme="dark"] .recent-link span{color:#9da5ba}

:where(button,a,input):focus-visible{outline:2px solid #7184e8;outline-offset:2px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}html[data-theme="dark"] :where(button,a,input):focus-visible{outline-color:#a5b2ff}
</style>
</head>
<body>
  <main class="page"><div class="wash"></div><section class="content">
    <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2.5 14.5 9.5 21.5 12l-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5L12 2.5Z"/><circle cx="12" cy="12" r="1.7"/></svg></div>
    <p class="eyebrow" id="greeting">A little room to explore</p><h1>Where to next?</h1><p class="sub" id="today"></p>
    <form class="search" id="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4.2 4.2"/></svg><input id="query" name="q" placeholder="Search the web or enter an address" autocomplete="off" autofocus><button type="submit">Explore <span>↗</span></button></form>
    <div class="section-heading"><p class="section-label">A FEW PLACES TO BEGIN</p><button id="resetShortcuts" type="button">Restore defaults</button></div><div class="links" id="links"></div>
    <section class="recent-section" id="recentSection" hidden><p class="section-label">PICK UP WHERE YOU LEFT OFF</p><div id="recentLinks"></div></section>
  </section><footer class="foot">Thoughtful by design <span>✦</span> powered by Blink</footer></main>
  <dialog id="shortcutDialog"><form method="dialog" id="shortcutForm"><span class="dialog-eyebrow">QUICK ACCESS</span><h2>Add a favorite place</h2><label for="shortcutName">Name</label><input id="shortcutName" maxlength="24" placeholder="e.g. YouTube" required><label for="shortcutUrl">Website address</label><input id="shortcutUrl" type="url" placeholder="https://example.com" required><div class="dialog-actions"><button type="button" id="cancelShortcut">Cancel</button><button type="submit" value="save" class="save-shortcut">Add shortcut</button></div></form></dialog>
  <script>
    const prefs = new URLSearchParams(location.search);
    let searchEngine = prefs.get('engine') || 'google';
    const theme = prefs.get('theme') || 'system';
    document.documentElement.dataset.theme = theme;
    const defaultShortcuts = [
      { name: 'YouTube', url: 'https://www.youtube.com', hint: 'Watch something good', icon: '▶', builtIn: true },
      { name: 'Wikipedia', url: 'https://www.wikipedia.org', hint: 'Follow your curiosity', icon: 'W', builtIn: true },
      { name: 'GitHub', url: 'https://github.com', hint: 'Build what’s next', icon: '⌘', builtIn: true },
      { name: 'Google', url: 'https://www.google.com', hint: 'Find your answer', icon: 'G', builtIn: true }
    ];
    let shortcuts;
    try { shortcuts = JSON.parse(localStorage.getItem('northstar.start.shortcuts')) || defaultShortcuts; } catch { shortcuts = defaultShortcuts; }
    if (!Array.isArray(shortcuts)) shortcuts = defaultShortcuts;
    shortcuts = shortcuts.filter(item => { try { return item && typeof item.name === 'string' && item.name.trim() && ['http:', 'https:'].includes(new URL(item.url).protocol); } catch { return false; } });
    const links = document.getElementById('links');
    function saveShortcuts() { localStorage.setItem('northstar.start.shortcuts', JSON.stringify(shortcuts)); }
    function renderShortcuts() {
      links.replaceChildren();
      shortcuts.forEach((item, index) => {
        const card = document.createElement('div'); card.className = 'shortcut-card'; card.draggable = true; card.dataset.index = index;
        const link = document.createElement('a'); link.className = 'link'; link.href = item.url;
        const icon = document.createElement('span'); icon.className = 'link-icon'; icon.textContent = item.icon || item.name.charAt(0).toUpperCase();
        const copy = document.createElement('span'); copy.className = 'link-copy';
        const name = document.createElement('strong'); name.textContent = item.name;
        const hint = document.createElement('span'); hint.textContent = item.hint || new URL(item.url).hostname;
        copy.append(name, hint); link.append(icon, copy); card.append(link);
        if (!item.builtIn) { const remove = document.createElement('button'); remove.className = 'remove-shortcut'; remove.type = 'button'; remove.title = `Remove ${item.name}`; remove.setAttribute('aria-label', `Remove ${item.name}`); remove.textContent = '×'; remove.onclick = () => { shortcuts.splice(index, 1); saveShortcuts(); renderShortcuts(); }; card.append(remove); }
        card.addEventListener('dragstart', event => { event.dataTransfer.setData('text/plain', String(index)); card.classList.add('moving'); });
        card.addEventListener('dragend', () => card.classList.remove('moving'));
        card.addEventListener('dragover', event => event.preventDefault());
        card.addEventListener('drop', event => { event.preventDefault(); const from = Number(event.dataTransfer.getData('text/plain')); const [moved] = shortcuts.splice(from, 1); shortcuts.splice(index, 0, moved); saveShortcuts(); renderShortcuts(); });
        links.append(card);
      });
      const add = document.createElement('button'); add.className = 'add-shortcut'; add.type = 'button'; add.disabled = shortcuts.length >= 11; add.innerHTML = '<span>＋</span><strong>Add a place</strong>'; add.onclick = () => { document.getElementById('shortcutForm').reset(); document.getElementById('shortcutDialog').showModal(); document.getElementById('shortcutName').focus(); }; links.append(add);
    }
    renderShortcuts();
    document.getElementById('resetShortcuts').onclick = () => { shortcuts = defaultShortcuts.map(item => ({ ...item })); saveShortcuts(); renderShortcuts(); };
    document.getElementById('cancelShortcut').onclick = () => document.getElementById('shortcutDialog').close();
    document.getElementById('shortcutForm').addEventListener('submit', event => {
      event.preventDefault();
      const name = document.getElementById('shortcutName').value.trim(); let parsed;
      try { parsed = new URL(document.getElementById('shortcutUrl').value.trim()); } catch { return; }
      if (!['http:', 'https:'].includes(parsed.protocol) || !name || shortcuts.length >= 11) return;
      shortcuts.push({ name, url: parsed.href, hint: parsed.hostname, icon: name.charAt(0).toUpperCase() }); saveShortcuts(); renderShortcuts(); document.getElementById('shortcutDialog').close();
    });
    const hour = new Date().getHours();
    document.getElementById('greeting').textContent = hour < 12 ? 'Good morning · a little room to explore' : hour < 18 ? 'Good afternoon · a little room to explore' : 'Good evening · a little room to explore';
    document.getElementById('today').textContent = new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date());
    window.northstarApplySettings = settings => {
      if (settings?.theme) document.documentElement.dataset.theme = settings.theme;
      if (settings?.searchEngine) searchEngine = settings.searchEngine;
    };
    const recentSection = document.getElementById('recentSection');
    const recentLinks = document.getElementById('recentLinks');
    window.northstarUpdateRecent = items => {
      recentLinks.replaceChildren();
      for (const item of (Array.isArray(items) ? items : []).slice(0, 5)) {
        if (!item || !/^https?:/i.test(item.url || '')) continue;
        const link = document.createElement('a'); link.className = 'recent-link'; link.href = item.url;
        const title = document.createElement('strong'); title.textContent = item.title || item.url;
        const url = document.createElement('span'); url.textContent = new URL(item.url).hostname;
        link.append(title, url); recentLinks.append(link);
      }
      recentSection.hidden = !recentLinks.childElementCount;
    };
    try { window.northstarUpdateRecent(JSON.parse(prefs.get('recent') || '[]')); } catch { window.northstarUpdateRecent([]); }
    const form = document.getElementById('search');
    form.addEventListener('submit', event => {
      event.preventDefault();
      const value = document.getElementById('query').value.trim();
      if (!value) return;
      const looksLikeAddress = /^[\w-]+(\.[\w-]+)+(:\d+)?([/?#]|$)/.test(value) && !value.includes(' ');
      const engines = { google: 'https://www.google.com/search?q=', bing: 'https://www.bing.com/search?q=', duckduckgo: 'https://duckduckgo.com/?q=', brave: 'https://search.brave.com/search?q=' };
      location.href = /^(https?:|file:\/\/)/i.test(value) ? value : looksLikeAddress ? `https://${value}` : `${engines[searchEngine] || engines.google}${encodeURIComponent(value)}`;
    });
  </script>
</body>
</html>
